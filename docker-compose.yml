version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: peworkflow
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/peworkflow?schema=public
    ports:
      - '3000:3000'
    depends_on:
      - db
volumes:
  db-data:
